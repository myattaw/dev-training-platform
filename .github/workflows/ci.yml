# Continuous integration: the fast checks, on every push and pull request.
#
# Docker-based suites are NOT run here (PRACSTACK_SKIP_DOCKER_TESTS=1): the
# code-runner and Lambda-runner security tests, DynamoDB Local, Oracle and the
# Docker submission e2e tests. Run `npm run verify` locally before merging;
# see docs/operations.md.
name: CI

on:
  push:
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRACSTACK_SKIP_DOCKER_TESTS: '1'
  # No telemetry from Angular or other tools in CI.
  NG_CLI_ANALYTICS: 'false'

jobs:
  checks:
    name: Lint, test, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Docker suites skipped)
        run: npm test

      - name: Build, with the private-content leak check
        run: npm run build

      - name: Dev server compiles
        run: npm run check:dev-server

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Docker-dependent ones skipped)
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies only; fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high
